<p-card [header]="'Cefalocaudal'" class="w-full max-w-md m-auto shadow-3"
    *ngIf="cefalocaudal && cefalocaudal.length > 0; else semDados">
    <div *ngFor="let item of cefalocaudal" class="p-fluid mb-4 border-bottom pb-4">
        <div class="field">
            <label>Paciente:</label>
            <span>{{ item.pacienteNome }} (ID: {{ item.pacienteId }})</span>
        </div>

        <div class="field">
            <label>Abdome:</label>
            <span>{{ item.abdome }}</span>
        </div>

        <div class="field">
            <label>Extremidades:</label>
            <span>{{ item.extremidades }}</span>
        </div>

        <div class="field">
            <label>Mucosas:</label>
            <span>{{ item.mucosas }}</span>
        </div>

        <div class="field">
            <label>Mvf:</label>
            <span>{{ item.mvf }}</span>
        </div>

        <div class="field">
            <label>Percussão:</label>
            <span>{{ item.percussao }}</span>
        </div>

        <p-divider></p-divider>

        <div class="field flex flex-wrap gap-2">
            <p-tag *ngIf="item.pupilasFotorreagentes" severity="success" value="Pupilas Fotorreagentes"></p-tag>
            <p-tag *ngIf="!item.pupilasFotorreagentes" severity="warn" value="Não Pupilas Fotorreagentes"></p-tag>

            <p-tag *ngIf="item.oftalmoplegia" severity="info" value="Oftalmoplegia"></p-tag>
            <p-tag *ngIf="!item.oftalmoplegia" severity="danger" value="Sem Oftalmoplegia"></p-tag>

            <p-tag *ngIf="item.ra" severity="success" value="RA"></p-tag>
            <p-tag *ngIf="!item.ra" severity="warn" value="Não RA"></p-tag>

            <p-tag *ngIf="item.reagePalpitacao" severity="success" value="Reage Palpitação"></p-tag>
            <p-tag *ngIf="!item.reagePalpitacao" severity="warn" value="Não Reage Palpitação"></p-tag>

            <p-tag *ngIf="item.rha" severity="success" value="RHA"></p-tag>
            <p-tag *ngIf="!item.rha" severity="warn" value="Não RHA"></p-tag>

            <p-tag *ngIf="item.tecMaiorQue2Segundos" severity="danger" value="Tec Maior que 2 segundos"></p-tag>
            <p-tag *ngIf="!item.tecMaiorQue2Segundos" severity="success" value="Tec Menor que 2 segundos"></p-tag>
        </div>

        <p-divider></p-divider>
    </div>
</p-card>

<ng-template #semDados>
    <p class="text-center text-600">Nenhum registro de Cefalocaudal encontrado para este paciente.</p>
</ng-template>
