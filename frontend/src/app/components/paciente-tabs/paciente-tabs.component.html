<div class="med-page">
  <div class="med-tabs">
    <div class="med-tab" [class.active]="abaAtiva === '0'" (click)="abaAtiva = '0'">HPP</div>
    <div class="med-tab" [class.active]="abaAtiva === '1'" (click)="abaAtiva = '1'">Dispositivos</div>
    <div class="med-tab" [class.active]="abaAtiva === '2'" (click)="abaAtiva = '2'">Evolução</div>
    <div class="med-tab" [class.active]="abaAtiva === '3'" (click)="abaAtiva = '3'">Cefalocaudal</div>
    <div class="med-tab" [class.active]="abaAtiva === '4'" (click)="abaAtiva = '4'">Ex. Físico</div>
    <div class="med-tab" [class.active]="abaAtiva === '5'" (click)="abaAtiva = '5'">Complementar</div>
  </div>

  <ng-container [ngSwitch]="abaAtiva">
    <app-paciente-hpp              *ngSwitchCase="'0'" [pacienteId]="pacienteId"/>
    <app-paciente-dispositivos     *ngSwitchCase="'1'" [pacienteId]="pacienteId"/>
    <app-paciente-evolucao-enfermagem *ngSwitchCase="'2'" [pacienteId]="pacienteId"/>
    <app-paciente-cefalocaudal     *ngSwitchCase="'3'" [pacienteId]="pacienteId"/>
    <app-paciente-exame-fisico     *ngSwitchCase="'4'" [pacienteId]="pacienteId"/>
    <app-paciente-exame-complementar *ngSwitchCase="'5'" [pacienteId]="pacienteId"/>
  </ng-container>
</div>
